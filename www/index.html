<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;color:#1f2937;background:#f3f4f6}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header{background:#fff;border-bottom:1px solid #d1d5db}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
h1{font-size:20px;margin:0 12px 0 0;font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{background:#fff;border:1px solid #9ca3af;border-radius:6px;padding:6px 12px;cursor:pointer}
nav button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:14px 16px;margin:12px 0}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:17px;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.stat{border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;background:#f9fafb}
.stat .k{font-size:15px;color:#4b5563}
.stat .v{font-size:24px;font-weight:700}
.btn{display:inline-block;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8;border-radius:6px;padding:9px 16px;cursor:pointer;margin:4px 6px 4px 0}
.btn:hover{background:#1e40af}
.btn.sec{background:#fff;color:#1f2937;border-color:#9ca3af}
.btn.sec:hover{background:#f3f4f6}
.btn.small{padding:5px 10px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:#4b5563}
.bar{height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:#1d4ed8;width:0}
.tbar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:8px 0}
.tbar>i{display:block;height:100%;background:#047857;width:100%}
.tbar.low>i{background:#b45309}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:#4b5563}
.badge{display:inline-block;border:1px solid #9ca3af;border-radius:4px;padding:0 6px;font-size:14px;color:#374151;background:#fff}
.badge.rev{border-color:#7c3aed;color:#5b21b6}
.badge.new{border-color:#047857;color:#065f46}
.label{font-size:15px;color:#4b5563;margin-bottom:4px}
.prompt{font-size:24px;font-weight:600;margin:4px 0;word-wrap:break-word}
.prompt.vi{font-size:22px}
.ipa{font-size:16px;color:#4b5563;font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",Arial,sans-serif}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid #9ca3af;border-radius:8px;padding:10px 12px;cursor:pointer;font-size:18px}
.opt:hover{border-color:#1d4ed8}
.opt b{min-width:22px;color:#1d4ed8}
.opt.ok{background:#dcfce7;border-color:#15803d}
.opt.bad{background:#fee2e2;border-color:#b91c1c}
.opt.dim{opacity:.55}
.fb{min-height:28px;margin-top:10px;font-weight:600}
.fb.ok{color:#166534}.fb.bad{color:#991b1b}
.flash{animation:fl .5s}
@keyframes fl{from{background:#dcfce7}to{background:#fff}}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tools .on{background:#fef3c7;border-color:#b45309;color:#78350f}
.w-ok{color:#166534;font-weight:600}
.w-bad{color:#991b1b;font-weight:600;text-decoration:underline}
.w-x{color:#6b7280;text-decoration:line-through}
.score{font-size:30px;font-weight:700}
.msg{border:1px solid #b45309;background:#fffbeb;color:#78350f;border-radius:8px;padding:10px 12px;margin:10px 0}
.msg.err{border-color:#b91c1c;background:#fef2f2;color:#7f1d1d}
.sec-h{margin-top:16px;font-weight:700}
.les{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-bottom:1px solid #e5e7eb;padding:7px 0}
.les .t{flex:1 1 260px}
.les .p{font-size:15px;color:#4b5563;min-width:150px}
.sl{font-size:16px;border-left:3px solid #d1d5db;padding:4px 8px;margin:4px 0}
.sl .e{font-weight:600}
label.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
input[type=number]{width:90px;padding:4px 6px;border:1px solid #9ca3af;border-radius:6px}
select{padding:4px 6px;border:1px solid #9ca3af;border-radius:6px;max-width:100%}
.kbd{font-size:14px;color:#4b5563}
.vbox{border:1px solid #9ca3af;border-radius:8px;padding:8px 12px;margin-top:10px;background:#f9fafb;font-size:16px;color:#1f2937}
.vbox.on{border-color:#1d4ed8;background:#eff6ff}
.vbox .heard{font-weight:700;color:#1f2937}
.vlive{color:#374151;margin-top:4px;min-height:22px}
.vErr{color:#991b1b;font-weight:600}
.btn.vt.on,.tools .vt.on{background:#047857;color:#fff;border-color:#047857}
.btn.ok2{background:#15803d;border-color:#15803d}.btn.ok2:hover{background:#166534}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 14px;border-radius:6px;font-size:15px;display:none;z-index:9}
@media (max-width:600px){.wrap{padding:8px}.prompt{font-size:21px}.prompt.vi{font-size:20px}.opt{font-size:17px}h1{font-size:18px}.card{padding:12px}}

ʤɒb/",0],["Thank you, I’m really proud of myself!","Cảm ơn bố, con thật sự tự hào về bản thân!","/θæŋk juː, aɪm ˈrɪli praʊd ʌv maɪˈsɛlf/",0],["How did you manage to do so well?","Con đã làm thế nào mà giỏi thế?","/haʊ dɪd jʊ ˈmænɪʤ tuː duː soʊ wɛl/",0],["I studied every day after school!","Con đã học mỗi ngày sau giờ học!","/aɪ ˈstʌdid ˈɛvri deɪ ˈæftər skuːl/",0],["We’re so proud of you!","Bố mẹ rất tự hào về con!","/wiːr soʊ praʊd ʌv juː/",0],["I’m glad I made you proud!","Con vui vì đã làm bố tự hào!","/aɪm ɡlæd aɪ meɪd juː praʊd/",0],["Keep up the great work!","Hãy tiếp tục giữ phong độ nhé!","/kiːp ʌp ðə greɪt wɜːrk/",0],["I’ll try my best, I promise!","Con sẽ cố gắng hết sức, con hứa!","/aɪl traɪ maɪ bɛst, aɪ ˈprɒmɪs/",0],["You’re getting better every day!","Con đang tiến bộ mỗi ngày đấy!","/jʊr ˈɡɛtɪŋ ˈbɛtər ˈɛvri deɪ/",0],["Thank you, I can feel it too!","Cảm ơn bố, con cũng cảm thấy thế!","/θæŋk juː, aɪ kæn fiːl ɪt tuː/",0],["I knew you could do it!","Bố biết con có thể làm được mà!","/aɪ njuː jʊ kʊd duː ɪt/",0],["I’m glad I didn’t disappoint you!","Con vui vì không làm bố thất vọng!","/aɪm ɡlæd aɪ dɪdnt ˌdɪsəˈpɔɪnt juː/",0],["How do you feel about your success?","Con cảm thấy thế nào về thành công của mình?","/haʊ duː jʊ fiːl əˈbaʊt jʊər səkˈsɛs/",0],["I feel really proud and happy!","Con cảm thấy rất tự hào và hạnh phúc!","/aɪ fiːl ˈrɪli praʊd ænd ˈhæpi/",0],["You’re setting a great example!","Con đang làm gương tốt đấy!","/jʊr ˈsɛtɪŋ ə greɪt ɪɡˈzæmpəl/",0],["I’ll keep working hard, I promise!","Con sẽ tiếp tục chăm chỉ, con hứa!","/aɪl kiːp ˈwɜːrkɪŋ hɑːrd, aɪ ˈprɒmɪs/",0],["You’ve come so far!","Con đã tiến bộ rất nhiều!","/jʊv kʌm soʊ fɑːr/",0],["I couldn’t have done it without your support!","Con không thể làm được nếu không có sự hỗ trợ của bố!","/aɪ ˈkʊdənt hæv dʌn ɪt wɪˈθaʊt jʊər səˈpɔrt/",0],["Don't worry, everyone makes mistakes.","Đừng lo, ai cũng mắc sai lầm mà con.","/doʊnt ˈwɝː.i, ˈev.ri.wʌn meɪks mɪsˈteɪks/",0],["What can we learn from this experience?","Chúng ta có thể rút ra bài học gì từ kinh nghiệm này?","/wʌt kæn wi lɜːrn frʌm ðɪs ɪkˈspɪər.i.əns/",0],["How do you feel about what happened?","Con cảm thấy thế nào về những gì đã xảy ra?","/haʊ duː juː fiːl əˈbaʊt wʌt ˈhæp.ənd/",0],["It's okay to feel disappointed, but don't give up.","Cảm thấy thất vọng là bình thường, nhưng đừng bỏ cuộc nhé.","/ɪts oʊˈkeɪ tuː fiːl ˌdɪsəˈpɔɪntɪd, bʌt doʊnt ɡɪv ʌp/",0],["What would you like to do differently next time?","Lần sau con muốn làm gì khác không?","/wʌt wʊd juː laɪk tuː duː ˈdɪfərəntli nɛkst taɪm/",0],["We're proud of how hard you tried.","Bố mẹ tự hào vì con đã cố gắng hết mình.","/wɪər praʊd ʌv haʊ hɑːrd juː traɪd/",0],["Failure is just part of the journey to success.","Thất bại chỉ là một phần của hành trình tới thành công thôi.","/ˈfeɪljər ɪz ʤʌst pɑːrt ʌv ðə ˈʤɝːni tuː səkˈsɛs/",0],["What matters most is that you learn and grow.","Điều quan trọng nhất là con học hỏi và phát triển.","/wʌt ˈmætərz moʊst ɪz ðæt juː lɜːrn ænd ɡroʊ/",0],["Every failure is a step closer to success.","Mỗi lần thất bại là một bước tiến gần hơn đến thành công.","/ˈev.ri ˈfeɪljər ɪz ə stɛp ˈkloʊsər tuː səkˈsɛs/",0],["You did your best, and that's what counts.","Con đã làm hết sức mình, và đó mới là điều quan trọng.","/juː dɪd jɔːr bɛst, ænd ðæts wʌt kaʊnts/",0],["Is there anything we could do to help?","Có điều gì bố mẹ có thể giúp con không?","/ɪz ðɛr ˈɛnɪθɪŋ wi kʊd duː tuː hɛlp/",0],["I believe in you, and I know you can succeed.","Bố mẹ tin tưởng con và biết rằng con sẽ thành công.","/aɪ bɪˈliːv ɪn juː, ænd aɪ noʊ juː kæn səkˈsiːd/",0],["Remember, it's not about being perfect.","Hãy nhớ rằng, không phải lúc nào cũng cần hoàn hảo.","/rɪˈmɛmbər, ɪts nɒt əˈbaʊt ˈbiːɪŋ ˈpɜr.fɪkt/",0],["What part of this challenge did you find the hardest?","Phần nào của thử thách này con thấy khó nhất?","/wʌt pɑːrt ʌv ðɪs ˈʧælɪnʤ dɪd juː faɪnd ðə ˈhɑrdɪst/",0],["You are capable of much more than you think.","Con có khả năng làm nhiều hơn con nghĩ đấ ","Bạn có nghĩ rằng ước mơ có thể thay đổi theo thời gian không?","/du ju θɪŋk driːmz kæn tʃeɪndʒ ˈoʊvɚ taɪm?/",0],["Yes, sometimes we discover new passions.","Có chứ, đôi khi chúng ta khám phá ra những đam mê mới.","/jɛs, ˈsʌmtaɪmz wi dɪsˈkʌvɚ nuː ˈpæʃənz/",0],["What advice do you have for dreamers?","Lời khuyên của bạn dành cho những người theo đuổi ước mơ là gì?","/wʌt ədˈvaɪs du ju hæv fɔːr ˈdriːmɚz?/",0],["Believe in yourself and never give up!","Hãy tin vào bản thân và không bao giờ bỏ cuộc!","/bɪˈliːv ɪn jɔːrˈsɛlf ənd ˈnɛvɚ ɡɪv ʌp/",0],["Do you track your monthly expenses?","Bạn có theo dõi chi tiêu hàng tháng không?","/duː juː træk jʊr ˈmʌnθli ɪkˈspɛnsɪz/",0],["Yes, I always keep a record of what I spend.","Có, tôi luôn ghi lại những gì mình chi tiêu.","/jɛs, aɪ ˈɔːlwɛz kiːp ə ˈrɛkərd ʌv wʌt aɪ spɛnd/",0],["Do you set a monthly budget?","Bạn có lập ngân sách hàng tháng không?","/duː juː sɛt ə ˈmʌnθli ˈbʌdʒɪt/",0],["Yes, I try not to overspend.","Có, tôi cố gắng không chi tiêu quá giới hạn.","/jɛs, aɪ traɪ nɒt tuː ˈoʊvərspɛnd/",0],["Do you save money every month?","Bạn có tiết kiệm tiền mỗi tháng không?","/duː juː seɪv ˈmʌni ˈɛvri mʌnθ/",0],["I try to save at least 20% of my income.","Tôi cố gắng tiết kiệm ít nhất 20% thu nhập của mình.","/aɪ traɪ tuː seɪv ət liːst ˈtwɛnti pɚˈsɛnt ʌv maɪ ˈɪnkʌm/",0],["What do you spend the most money on?","Bạn thường chi tiêu nhiều nhất vào khoản nào?","/wʌt duː juː spɛnd ðə moʊst ˈmʌni ɒn/",0],["Most of my money goes to rent and food.","Phần lớn tiền của tôi dành cho tiền thuê nhà và thực phẩm.","/moʊst ʌv maɪ ˈmʌni ɡoʊz tuː rɛnt ænd fuːd/",0],["Do you invest in stocks?","Bạn có đầu tư vào chứng khoán không?","/duː juː ɪnˈvɛst ɪn stɑːks/",0],["Yes, I started investing a year ago.","Có chứ, tôi mới bắt đầu đầu tư cách đây một năm.","/jɛs, aɪ ˈstɑːrtɪd ɪnˈvɛstɪŋ ə jɪr əˈɡoʊ/",0],["Do you have an emergency fund?","Bạn có quỹ khẩn cấp không?","/duː juː hæv ən ɪˈmɜrdʒənsi fʌnd?/",0],["Yes, I have enough to cover six months of expenses.","Có, tôi có đủ tiền để trang trải chi phí trong sáu tháng.","/jɛs, aɪ hæv ɪˈnʌf tuː ˈkʌvər sɪks mʌnθs ʌv ɪkˈspɛnsɪz/",0],["Are you in debt?","Bạn có mắc nợ không?","/ɑːr juː ɪn dɛt/",0],["I only have a small student loan.","Tôi chỉ có một khoản vay sinh viên nhỏ.","/aɪ ˈoʊnli hæv ə smɔːl ˈstuːdənt loʊn/",0],["Do you use credit cards often?","Bạn có thường dùng thẻ tín dụng không?","/duː juː juːz ˈkrɛdɪt kɑːrdz ˈɔːfən/",0],["I do, but I always pay off the full balance every month.","Tôi có, nhưng tôi luôn thanh toán đầy đủ mỗi tháng.","/aɪ duː, bʌt aɪ ˈɔːlwɛz peɪ ɔːf ðə fʊl ˈbæləns ˈɛvri mʌnθ/",0],["Do you have a retirement plan?","Bạn có kế hoạch nghỉ hưu chưa?","/duː juː hæv ə rɪˈtaɪərmənt plæn/",0],["I'm contributing to my company's retirement fund.","Tôi đang góp tiền vào quỹ hưu trí của công ty.","/aɪm ˈkɑːntrɪbjuːtɪŋ tuː maɪ ˈkʌmpəniːz rɪˈtaɪərmənt fʌnd/",0],["Do you have a financial goal for this year?","Bạn có mục tiêu tài chính trong năm nay không?","/duː juː hæv ə fəˈnænʃəl ɡoʊl fɔːr ðɪs jɪr/",0],["I want to save enough money to travel to Europe.","Tôi muốn tiết kiệm đủ tiền để đi du lịch châu Âu.","/aɪ wɑːnt tuː seɪv ɪˈnʌf ˈmʌni tuː ˈtrævəl tuː ˈjʊrəp/",0],["Excuse me, where is the nearest bus stop?","Xin lỗi, trạm xe buýt gần nhất ở đâu?","/ɪkˈskjuːz mi wɛr ɪz ðə ˈnɪrɪst bʌs stɑːp/",0],["It’s just down this street, on the left.","Nó ở ngay cuối con phố này, bên trái.","/ɪts dʒʌst daʊn ðɪs striːt ɑn ðə lɛft/",0],["Does bus number 25 go downtown?","Xe buýt số 25 có đi đến trung tâm thành phố không?","/dʌz bʌs ˈnʌmbɚ ˈtwɛnti faɪv ɡoʊ daʊnˈtaʊn/",0],["Yes, it does. You can get off at the last stop.","Có, nó có đi. Bạn có thể xuống ở trạm cuối.","/jɛs ɪt dʌz ju kən gɛt ɔf ət ðə læst stɑːp/",0],["Where can I buy a ticket?","Tôi có thể mua vé ở đâu?","/wɛr kən aɪ baɪ ə ˈtɪkɪt/",0],["You can buy one from the driver or at the ticket machine.","Bạn có thể mua vé từ tài xế hoặc ở máy bán vé.","/ju kən baɪ wʌn frəm ðə ˈdraɪvɚ ɔr æt ðə ˈtɪkɪt məˈʃiːn/",0],["Ho function touchStreak(){const t=dayNum();if(S.streak.last===t)return;S.streak.n=(S.streak.last===t-1)?S.streak.n+1:1;S.streak.last=t;}
function dueOf(o,p){ // p=1|2
  if(!o||!o['m'+p])return Infinity;const s=o['s'+p]|0;return s<OFFS.length?o['md'+p]+OFFS[s]:Infinity;}
function master1(i){const o=it(i);o.m1=1;o.md1=dayNum();o.s1=0;}
function master2(i){const o=it(i);o.m2=1;o.md2=dayNum();o.s2=0;}
function quota(){rollDay();return Math.max(0,S.set.daily+S.day.extra-S.day.neu);}
function setFlag(i,on){const o=it(i);if(on){o.f=1;const t=dayNum();if(o.m1){o.md1=t;o.s1=0;}if(o.m2){o.md2=t;o.s2=0;}}else delete o.f;save();}
function counts(){const t=dayNum();const c={seen:0,m1:0,m2:0,due1:0,due2:0,learn1:0,avail2:0,flag:0};
  for(const k in S.it){const o=S.it[k];if(o.sn)c.seen++;if(o.m1){c.m1++;if(dueOf(o,1)<=t)c.due1++;if(!o.m2)c.avail2++;}else if(o.sn)c.learn1++;
    if(o.m2){c.m2++;if(dueOf(o,2)<=t)c.due2++;}if(o.f)c.flag++;}return c;}
function nextNew(){ // câu mới kế tiếp theo thứ tự bài (ưu tiên bài đang chọn)
  if(S.focus>=0&&LES[S.focus]){const L=LES[S.focus];for(let j=L[2];j<L[2]+L[3];j++){const o=S.it[j];if(!o||!o.sn)return j;}}
  for(let j=0;j<N;j++){const o=S.it[j];if(!o||!o.sn)return j;}return null;}

/* ===== Tạo 4 lựa chọn ===== */
function normEn(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9]/g,'');}
function normVi(s){return String(s).toLowerCase().normalize('NFC').replace(/\(.*?\)/g,' ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();}
function viPrefix(i){const p=VI(i).split(/…|\.\.\./)[0];return normVi(p);}
function firstWords(s,n){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\b[qa]:\s*/g,'').replace(/[^a-z' ]/g,' ').trim().split(/\s+/).slice(0,n).join(' ');}
const NV=ITEMS.map((x,i)=>normVi(x[1])), NE=ITEMS.map(x=>normEn(x[0]));
function conflict(i,j){
  if(i===j||NE[i]===NE[j])return true;
  const a=NV[i],b=NV[j];if(a===b)return true;
  if(a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a)))return true;
  if(PART(i)||PART(j)){const pa=viPrefix(i),pb=viPrefix(j);
    if(pa&&pb&&(pa===pb||pa.includes(pb)||pb.includes(pa)))return true;
    if(firstWords(EN(i),2)===firstWords(EN(j),2))return true;}
  return false;}
function makeOptions(id,dir){
  const want=PART(id), li=LESSON_OF[id], shown=dir==='ev'?VI:EN, len0=shown(id).length;
  const chosen=[];
  const ok=j=>PART(j)===want&&!conflict(id,j)&&chosen.every(c=>!conflict(c,j));
  for(let d=0;d<LES.length&&chosen.length<3;d++){
    const lis=d===0?[li]:[li+d,li-d];
    for(const L of lis){if(L<0||L>=LES.length||chosen.length>=3)continue;
      const l=LES[L];let c=[];for(let j=l[2];j<l[2]+l[3];j++)if(j!==id&&PART(j)===want)c.push(j);
      c.sort((x,y)=>Math.abs(shown(x).length-len0)-Math.abs(shown(y).length-len0));
      c=shuffle(c.slice(0,8)).concat(c.slice(8));
      for(const j of c){if(chosen.length>=3)break;if(ok(j))chosen.push(j);}}
  }
  const opts=shuffle([id].concat(chosen));
  return {opts,correct:opts.indexOf(id)};
}

/* ===== Chấm điểm phần nói ===== */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,hundred:100};
function spoken(t){return String(t).replace(/\b[QA]:\s*/g,'').replace(/\s*\/\s*/g,'. ').replace(/\s+/g,' ').trim();}
function tokens(s){
  s=' '+String(s).toLowerCase().replace(/[’‘`´]/g,"'")+' ';
  s=s.replace(/\b[qa]:\s*/g,' ').replace(/\//g,' ').replace(/\b([a-z])\.(?=[a-z]\.)/g,'$1').replace(/\./g,' ');
  s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not').replace(/\bain't\b/g,'is not')
     .replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would')
     .replace(/\blet's\b/g,'let us').replace(/\b(it|that|what|he|she|there|here|who|where|how|when|why|this|everything|nothing|something|everyone|nobody|someone)'s\b/g,'$1 is')
     .replace(/'s\b/g,'').replace(/\bokay\b/g,'ok').replace(/\balright\b/g,'all right').replace(/\bgonna\b/g,'going to').replace(/\bwanna\b/g,'want to').replace(/%/g,' percent');
  s=s.replace(/[^a-z0-9 ]+/g,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>w in NUMW?String(NUMW[w]):w);
}
function scoreSpeech(ref,hyp){
  const R=tokens(spoken(ref)),H=tokens(hyp||''),n=R.length,m=H.length;
  const dp=[];for(let i=0;i<=n;i++){dp.push(new Array(m+1).fill(0));dp[i][0]=i;}for(let j=0;j<=m;j++)dp[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(R[i-1]===H[j-1]?0:1));
  const dist=dp[n][m];const pct=n?Math.max(0,Math.round((1-dist/n)*100)):0;
  // đánh dấu từ đúng/sai
  const marks=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&R[i-1]===H[j-1]&&dp[i][j]===dp[i-1][j-1]){marks.unshift({w:R[i-1],t:'ok'});i--;j--;}
    else if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+1){marks.unshift({w:R[i-1],t:'bad',said:H[j-1]});i--;j--;}
    else if(i>0&&dp[i][j]===dp[i-1][j]+1){marks.unshift({w:R[i-1],t:'bad',said:''});i--;}
    else {marks.unshift({w:H[j-1],t:'x'});j--;}
  }
  return {pct,dist,ref:R,hyp:H,marks};
}

/* ===== Chấm nghĩa tiếng Việt khi trả lời bằng giọng nói ===== */
const PASS_VI=90, PASS_EN=80;  // mặc định: nói nghĩa tiếng Việt >= 90%, nói câu tiếng Anh >= 80% (đổi trong Cài đặt)
function passVi(){return (S&&S.set&&+S.set.passVi)||PASS_VI;}
function passEn(){return (S&&S.set&&+S.set.passEn)||PASS_EN;}
const VI_FILL=new Set(['à','ạ','ừ','ờ','ừm','ừa','ờm','ơ','ơi','nhé','nhỉ','nha','nhá','hả','hở','đấy','thì','mà','vâng','dạ']);
const VI_STOP=new Set(['là','của','cái','chiếc','những','các','rất','lắm','đã','đang','sẽ','rồi','và','thế','vậy','này','đó','kia','nào','ấy','luôn','cả','thôi','quá']);
const VI_SYN={'mình':'tôi','tớ':'tôi','tao':'tôi','cậu':'bạn','mày':'bạn','chẳng':'không','chả':'không','ko':'không','hông':'không',
  'một':'1','hai':'2','ba':'3','bốn':'4','tư':'4','năm':'5','sáu':'6','bảy':'7','tám':'8','chín':'9','mười':'10','okay':'ok','oke':'ok'};
function stripVi(w){return w.normalize('NFD').replace(/\p{M}/gu,'').replace(/đ/g,'d');}
function viToks(s,keepSlash){
  s=String(s||'').normalize('NFC').toLowerCase();
  s=s.replace(/(^|[\s(\/])[hđ]\s*:/g,'$1 ').replace(/…|\.\.\./g,' ');
  s=keepSlash?s.replace(/\//g,' / ').replace(/[^\p{L}\p{N}\s\/]+/gu,' '):s.replace(/[^\p{L}\p{N}\s]+/gu,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>VI_SYN[w]||w).filter(w=>!VI_FILL.has(w));
}
function slashVariants(t,depth){ // "chị/em gái" -> chị gái | em gái ; "A B / C D" -> nhiều cách ghép
  const k=t.indexOf('/');if(k<0)return [t];if(depth>2)return [t.filter(w=>w!=='/')];
  const L=t.slice(0,k),R=t.slice(k+1);const out=[];
  for(let a=1;a<=3;a++)for(let b=1;b<=3;b++){if(b<=R.length&&a<=L.length){out.push(L.concat(R.slice(b)));out.push(L.slice(0,L.length-a).concat(R));}}
  if(L.length>=3)out.push(L.slice());if(R.filter(w=>w!=='/').length>=3)out.push(R.slice());
  const res=[];const seen=new Set();
  for(const v of out)for(const x of slashVariants(v,depth+1)){const key=x.join(' ');if(x.length&&!seen.has(key)){seen.add(key);res.push(x);}}
  return res.length?res:[t.filter(w=>w!=='/')];
}
const _viRefCache=new Map();
function viRefs(i){
  if(_viRefCache.has(i))return _viRefCache.get(i);
  const v=VI(i),dlg=/(^|\s)[HĐ]\s*:/.test(v);
  const texts=[v.replace(/\(.*?\)/g,' '),v.replace(/[()]/g,' ')];
  const out=[];const seen=new Set();
  for(const t of texts){let tk=viToks(t,!dlg);for(const x of (dlg?[tk]:slashVariants(tk,0))){const key=x.join(' ');if(!seen.has(key)){seen.add(key);out.push(x);}}}
  _viRefCache.set(i,out);return out;
}
function levTok(R,H){const n=R.length,m=H.length;let prev=new Array(m+1);for(let j=0;j<=m;j++)prev[j]=j;
  for(let i=1;i<=n;i++){const cur=[i];for(let j=1;j<=m;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(R[i-1]===H[j-1]?0:1));prev=cur;}return prev[m];}
function recallTok(R,H){if(!R.length)return 0;const bag=new Map();H.forEach(w=>bag.set(w,(bag.get(w)||0)+1));let hit=0;
  R.forEach(w=>{const c=bag.get(w)|0;if(c>0){hit++;bag.set(w,c-1);}});return hit/R.length;}
function scoreOne(R,H,partial){
  if(!R.length||!H.length)return 0;
  if(partial)return recallTok(R,H);                       // nghĩa mẫu câu: chỉ so phần cố định, phần "…" nói gì cũng được
  const lev=Math.max(0,1-levTok(R,H)/R.length);
  const Rc=R.filter(w=>!VI_STOP.has(w)),Hc=H.filter(w=>!VI_STOP.has(w));
  let rec=Rc.length>=3?recallTok(Rc,Hc):0;               // chỉ xét "đủ ý" khi nghĩa có từ 3 từ chính trở lên
  if(rec&&Hc.length){const prec=rec*Rc.length/Hc.length;if(prec<0.5)rec*=prec/0.5;} // nói thừa quá nhiều từ (đọc nhiều đáp án) thì giảm điểm
  return Math.max(lev,rec);
}
function scoreVi(i,hyp){ // 0–100: so câu nói với nghĩa tiếng Việt của câu i (có dấu và bỏ dấu, lấy điểm cao hơn)
  const H=viToks(hyp,false);if(!H.length)return 0;const Hs=H.map(stripVi);const part=PART(i);let best=0;
  for(const R of viRefs(i)){best=Math.max(best,scoreOne(R,H,part),scoreOne(R.map(stripVi),Hs,part));if(best>=1)break;}
  return Math.round(best*100);
}
function simVi(i,hyp){ // độ giống "hai chiều" (phạt cả từ thiếu lẫn từ thừa) – chỉ dùng để phân xử khi hòa điểm
  const H=viToks(hyp,false);if(!H.length)return 0;const Hs=H.map(stripVi);let best=0;
  for(const R of viRefs(i)){const n=Math.max(R.length,H.length);best=Math.max(best,1-levTok(R,H)/n,1-levTok(R.map(stripVi),Hs)/n);}
  return best;
}
function judgeVi(i,mc,hyp){ // đúng khi >= 90% và không giống đáp án sai nào hơn (hòa điểm thì xét câu nào khớp sát hơn)
  const c=scoreVi(i,hyp);let w=0,wk=-1;
  if(mc)mc.opts.forEach((o,k)=>{if(o===i)return;const s=scoreVi(o,hyp);if(s>w){w=s;wk=k;}});
  let win=c>w;
  if(!win&&c===w&&c>=passVi()){const sc=simVi(i,hyp);win=mc.opts.every((o,k)=>o===i||scoreVi(o,hyp)<c||simVi(o,hyp)<sc);}
  return {c,w,wk,ok:c>=passVi()&&win,closer:!win&&w>=c&&w>=50};
}

function judgeEn(i,mc,hyp){ // chiều Việt → Anh: chấm từng từ như Phần 2; đúng khi >= 80% và không giống đáp án sai hơn
  const r=scoreSpeech(EN(i),hyp);const c=r.pct;let w=0,wk=-1;
  if(mc)mc.opts.forEach((o,k)=>{if(o===i)return;const s=scoreSpeech(EN(o),hyp).pct;if(s>w){w=s;wk=k;}});
  return {c,w,wk,ok:c>=passEn()&&c>w,closer:w>=c&&w>=50,r};
}
/* ===== Micro dùng chung: 1 phiên nhận giọng nói liên tục, dùng lại cho mọi câu ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_FILE=location.protocol==='file:';
const VOICE={rec:null,lang:'',running:false,starting:false,want:false,handler:null,base:0,len:0,starts:0,autoUsed:false,fatal:'',restarts:[]};
function killRec(){const r=VOICE.rec;if(r){r.onstart=r.onresult=r.onerror=r.onend=null;try{r.abort();}catch(e){}}
  VOICE.rec=null;VOICE.running=false;VOICE.starting=false;VOICE.base=0;VOICE.len=0;}
function rawStart(){if(!VOICE.rec)return;VOICE.fatal='';VOICE.starting=true;VOICE.base=0;VOICE.len=0;VOICE.starts++;
  try{VOICE.rec.start();}catch(e){VOICE.starting=false;const r=VOICE.rec;setTimeout(()=>{if(VOICE.rec===r&&VOICE.want&&!VOICE.running&&!VOICE.starting){VOICE.starting=true;try{r.start();}catch(_){VOICE.starting=false;}}},300);}}
function voiceStart(lang){
  if(!SR)return false;VOICE.want=true;
  if(VOICE.rec&&VOICE.lang===lang&&(VOICE.running||VOICE.starting))return true;
  if(VOICE.rec&&VOICE.lang!==lang)killRec();
  if(!VOICE.rec){const r=new SR();r.lang=lang;r.continuous=true;r.interimResults=true;r.maxAlternatives=3;VOICE.rec=r;VOICE.lang=lang;
    r.onstart=()=>{VOICE.running=true;VOICE.starting=false;};
    r.onresult=e=>{VOICE.len=e.results.length;if(VOICE.handler)VOICE.handler(e);else VOICE.base=e.results.length;};
    r.onerror=e=>{const er=e&&e.error;if(er==='not-allowed'||er==='service-not-allowed'||er==='audio-capture'){VOICE.fatal=er;VOICE.want=false;}
      if(SES&&SES.onVoiceErr)SES.onVoiceErr(er);};
    r.onend=()=>{VOICE.running=false;VOICE.starting=false;VOICE.base=0;VOICE.len=0;
      // http://localhost (MO_TOOL.bat): tự nối lại – trình duyệt đã nhớ quyền nên không hỏi lại.
      // file:///: chỉ tự nối lại khi đang chờ người học nói (Chrome có thể hỏi lại quyền).
      if(VOICE.want&&!VOICE.fatal&&(!IS_FILE||VOICE.handler)){const t=Date.now();VOICE.restarts=VOICE.restarts.filter(x=>t-x<10000);
        if(VOICE.restarts.length<5){VOICE.restarts.push(t);setTimeout(()=>{if(VOICE.want&&VOICE.rec&&!VOICE.running&&!VOICE.starting)rawStart();},200);}}};
  }
  rawStart();return true;
}
function voiceEnsure(lang){ // dùng khi đến lượt nghe; true = micro đang/đã được bật
  if(!SR)return false;
  if(VOICE.rec&&VOICE.lang===lang&&(VOICE.running||VOICE.starting))return true;
  VOICE.autoUsed=true;voiceStart(lang);fileNoteOnce();return true; // v3: luôn tự bật khi đến lượt nghe (cả file:///)
}
function voiceStop(){VOICE.want=false;VOICE.handler=null;killRec();}
function voiceListen(h){VOICE.base=Math.max(VOICE.base,VOICE.len);VOICE.handler=h;VOICE.listenAt=performance.now();VOICE.listens=(VOICE.listens|0)+1;}
function fileNoteOnce(){ // file:///: nhắc dùng MO_TOOL.bat – chỉ 1 lần mỗi lần mở trang
  if(!IS_FILE||VOICE.noteShown)return;VOICE.noteShown=true;const d=document.getElementById('fnote');if(!d)return;
  d.innerHTML=`<div class="wrap"><div class="msg" style="margin:8px 0">${FILE_NOTE} <button class="btn sec small" id="fnoteX">Đã hiểu</button></div></div>`;
  document.getElementById('fnoteX').onclick=()=>{d.innerHTML='';};}
const GAP=300; // ms nghỉ sau khi máy đọc xong rồi mới nghe (để không thu tiếng máy)
function voiceUnlisten(){VOICE.handler=null;VOICE.base=Math.max(VOICE.base,VOICE.len);}
const FILE_NOTE='Bạn đang mở file trực tiếp từ ổ đĩa (file:///). Chrome có thể hỏi quyền micro lại khi đổi tiếng Việt ↔ tiếng Anh, khi micro tự ngắt hoặc khi mở lại file. Muốn chỉ cho phép 1 lần rồi thôi, hãy mở bằng <b>MO_TOOL.bat</b> (xem HUONG_DAN_MICRO.txt).';

/* ===== Giọng đọc (TTS) ===== */
const TTS='speechSynthesis' in window;
let voices=[];
function loadVoices(){if(!TTS)return;voices=speechSynthesis.getVoices()||[];}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function enVoices(){return voices.filter(v=>/^en[-_]/i.test(v.lang));}
function pickVoice(){
  const all=enVoices();if(S.set.voice){const v=all.find(v=>v.name===S.set.voice);if(v)return v;}
  const us=all.filter(v=>/^en[-_]US/i.test(v.lang));
  for(const p of [/Google US English/i,/Aria.*Natural/i,/Jenny.*Natural/i,/Guy.*Natural/i,/Natural/i,/Samantha/i,/Zira/i,/David/i]){const v=us.find(v=>p.test(v.name));if(v)return v;}
  return us[0]||all[0]||null;}
let speakTok=0;
function speak(text,done){
  const tok=++speakTok;let fired=false;const fin=()=>{if(fired||tok!==speakTok)return;fired=true;done&&done();};
  const t=spoken(text);const words=t.split(/\s+/).length;
  setTimeout(fin,1800+words*650/(S.set.rate||1)); // dự phòng nếu trình duyệt không báo xong
  if(!TTS){setTimeout(fin,300);return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';const v=pickVoice();if(v)u.voice=v;u.rate=S.set.rate||0.9;
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);}catch(e){setTimeout(fin,300);}
}
function stopSpeak(){speakTok++;if(TTS)try{speechSynthesis.cancel();}catch(e){}}

function render(){({home:renderHome,p1:renderP1Start,p2:renderP2Start,les:renderLessons,set:renderSettings})[view]();}
function lessonName(li){return LES[li][1];}

function renderHome(){
  rollDay();const c=counts(),t=dayNum(),daily=S.set.daily;
  const started=S.stats.ans>0;const dayX=started?t-S.start+1:0;
  const planDays=Math.ceil(N/daily);const expected=Math.min(N,dayX*daily);
  const diff=c.seen-expected;
  $('#main').innerHTML=`
  <div class="card"><h2>Hôm nay ${fmtDay(t)}</h2>
   <div class="grid">
    <div class="stat"><div class="k">Ngày học</div><div class="v">${started?dayX+' / '+planDays:'Chưa bắt đầu'}</div></div>

   <div class="bar"><i style="width:${c.m1/N*100}%"></i></div>

   <div class="bar"><i style="width:${c.m2/N*100}%"></i></div>
   <p class="muted" style="margin-bottom:0">Đã gặp ${fmtN(c.seen)} câu · đang học dở ${fmtN(c.learn1)} câu · chờ luyện nói ${fmtN(c.avail2)} câu.
   ${started?(diff>=0?`Bạn đang <b>đúng hoặc vượt</b> kế hoạch (${diff>0?'+'+fmtN(diff):'0'} câu).`:`Bạn đang <b>chậm</b> kế hoạch ${fmtN(-diff)} câu.`):''}</p>
  </div>
  <div class="card"><h2>Kế hoạch ${planDays} ngày</h2>
   <ul style="margin:0;padding-left:20px">
   <li>Tổng ${fmtN(N)} câu (đã gộp câu trùng), học lần lượt theo từng bài.</li>
   <li>Mỗi ngày <b>${daily} câu mới</b> → xong sau <b>${planDays} ngày</b>. Đổi số câu trong <i>Cài đặt</i>.</li>
   <li>Câu đã thuộc tự quay lại để ôn sau <b>1, 3, 7, 15 ngày</b> (và 30 ngày). Ôn sai thì câu đó học lại từ đầu.</li>
   <li>Một câu là <b>thuộc</b> khi trả lời đúng <b>2 lần liên tiếp ở cả 2 chiều</b> (Anh → Việt và Việt → Anh).</li>
   <li>Mỗi câu có ${S.set.secs} giây. Hết giờ tính là sai. Câu sai quay lại sau 3–5 câu cho đến khi đúng.</li>
   <li>Có thể <b>bấm A–D</b> hoặc bật <b>🎤 Trả lời bằng giọng nói</b>: câu Anh → Việt <b>nói nghĩa tiếng Việt</b> (khớp từ ${passVi()}%), câu Việt → Anh <b>nói câu tiếng Anh</b> (khớp từ ${passEn()}%) là đúng; nói sai được nói lại 1 lần; có nút “Tính là đúng” nếu máy nghe nhầm).</li>
   <li>Chỉ câu đã thuộc ở Phần 1 mới sang Phần 2. Phần 2 đọc đạt từ ${PASS}% trở lên, 2 lần liên tiếp là đạt.</li>
   <li>Nút <b>"Cần ôn lại"</b>: câu được đánh dấu sẽ quay lại vào ngày mai, rồi sau 3, 7, 15 ngày.</li>
   </ul>
   <p class="kbd">Phím tắt: 1–4 hoặc A–D chọn đáp án · Cách (Space) nghe lại · Enter sang câu tiếp · P tạm dừng · M "Cần ôn lại".</p>
  </div>`;
  $('#goP1').onclick=()=>go('p1');$('#goP2').onclick=()=>go('p2');
}

/* ===== Phiên học ===== */
let SES=null;
function endSession(silent){
  if(!SES)return;clearInterval(SES.timer);clearTimeout(SES.wait);stopSpeak();voiceStop();SES=null;save();if(!silent)render();}
function insertAt(card,k){SES.q.splice(Math.min(k,SES.q.length),0,card);}
function sesProgress(){const tot=SES.revTotal+SES.targetLearn;return {done:SES.revDone+SES.mastered,tot};}

/* --- Phần 1 --- */
function renderP1Start(){
  rollDay();const c=counts(),q=quota();
  const avail=N-c.seen;
  $('#main').innerHTML=`<div class="card"><h2>Phần 1: Thuộc nghĩa</h2>
   <p>Hôm nay: <b>${c.due1}</b> câu cần ôn · <b>${c.learn1}</b> câu đang học dở · <b>${Math.min(q,avail)}</b> câu mới còn lại trong ngày.</p>
   ${S.focus>=0?`<p>Đang ưu tiên bài: <b>${esc(lessonName(S.focus))}</b> <button class="btn sec small" id="clrF">Bỏ chọn bài</button></p>`:''}
   <p><button class="btn" id="st">Bắt đầu</button>
   ${q===0&&avail>0?'<button class="btn sec" id="more">Học thêm 20 câu mới</button>':''}</p>
   <p>${voiceBtnHTML('pVoice')} <span class="muted" style="font-size:15px">Bật thì rảnh tay, không cần bấm nút micro: câu Anh → Việt, máy đọc câu tiếng Anh xong tự nghe bạn <b>nói nghĩa tiếng Việt</b>; câu Việt → Anh, bạn <b>nói câu tiếng Anh</b>. Đúng thì tự sang câu kế. Vẫn bấm A–D được.</span></p>
   <div id="vnote">${voiceOn()&&IS_FILE?`<div class="msg">${FILE_NOTE}</div>`:''}</div>
   <p class="muted">Cách học: câu mới hiện cả nghĩa để xem trước (có thể tắt trong Cài đặt), sau đó hỏi xen kẽ 2 chiều. Đúng thì sang câu kế ngay; sai hoặc hết ${S.set.secs} giây thì xem đáp án, câu đó quay lại sau 3–5 câu.</p></div>`;
  $('#st').onclick=startP1;$('#pVoice').onclick=()=>setVoice(!voiceOn());
  if($('#more'))$('#more').onclick=()=>{S.day.extra+=20;save();startP1();};
  if($('#clrF'))$('#clrF').onclick=()=>{S.focus=-1;save();render();};
}
function startP1(){
  rollDay();const t=dayNum();
  const rev=[],learn=[];
  for(const k in S.it){const o=S.it[k];if(o.m1){if(dueOf(o,1)<=t)rev.push(+k);}else if(o.sn)learn.push(+k);}
  learn.sort((a,b)=>a-b);
  if(S.focus>=0){const L=LES[S.focus];learn.sort((a,b)=>((LESSON_OF[a]===S.focus)?0:1)-((LESSON_OF[b]===S.focus)?0:1)||a-b);}
  shuffle(rev);
  const ch=S.set.chunk>0?S.set.chunk:1e9;
  rev.splice(ch);learn.splice(Math.max(0,ch-rev.length));
  const newAvail=Math.max(0,Math.min(quota(),N-counts().seen,ch-rev.length-learn.length));
  SES={view:'p1',part:1,q:[],learnPool:learn,newLeft:newAvail,active:new Set(),revTotal:rev.length,revDone:0,mastered:0,targetLearn:learn.length+newAvail,ans:0,ok:0,cur:null};
  rev.forEach(i=>SES.q.push({id:i,dir:((S.it[i].s1|0)%2?'ve':'ev'),rev:1}));
  topUp1();
  if(!SES.q.length){endSession(true);$('#main').innerHTML=`<div class="card"><h2>Không còn câu nào cần học lúc này</h2><p>Bạn đã xong phần ôn và đủ số câu mới của hôm nay.</p>
   <button class="btn" id="more">Học thêm 20 câu mới</button> <button class="btn sec" id="g2">Sang Phần 2</button></div>`;
   $('#more').onclick=()=>{S.day.extra+=20;save();startP1();};$('#g2').onclick=()=>go('p2');return;}
  nextCard();
}
function topUp1(){
  while(SES.active.size<WS){
    let id=null,isNew=false;
    if(SES.learnPool.length)id=SES.learnPool.shift();
    else if(quota()>0&&SES.newLeft>0){id=nextNew();if(id==null)break;isNew=true;SES.newLeft--;}
    else break;
    const o=it(id);
    if(isNew){o.sn=1;o.a=0;o.b=0;S.day.neu++;}
    if((o.a|0)>=NEED&&(o.b|0)>=NEED){master1(id);continue;}
    SES.active.add(id);
    if(isNew&&S.set.preview)SES.q.push({id,dir:'pv'});
    if((o.a|0)<NEED)SES.q.push({id,dir:'ev'});
    if((o.b|0)<NEED)SES.q.push({id,dir:'ve'});
  }
}
function answer1(card,ok){
  const o=it(card.id);SES.ans++;if(ok)SES.ok++;S.stats.ans++;if(ok)S.stats.ok++;S.day.ans++;touchStreak();
  if(card.rev){
    SES.revDone++;
    if(ok){o.s1=(o.s1|0)+1;}
    else{o.m1=0;o.a=0;o.b=0;o.w=(o.w|0)+1;SES.active.add(card.id);SES.targetLearn++;
      const other=card.dir==='ev'?'ve':'ev';insertAt({id:card.id,dir:card.dir},rint(3,5));insertAt({id:card.id,dir:other},rint(5,8));}
  }else{
    const f=card.dir==='ev'?'a':'b';
    if(ok){o[f]=(o[f]|0)+1;if(o[f]<NEED)insertAt({id:card.id,dir:card.dir},rint(5,8));}
    else{o[f]=0;o.w=(o.w|0)+1;insertAt({id:card.id,dir:card.dir},rint(3,5));}
    if((o.a|0)>=NEED&&(o.b|0)>=NEED){master1(card.id);SES.active.delete(card.id);SES.mastered++;topUp1();}
  }
  save();
}

function nextCard(){
  if(!SES)return;clearInterval(SES.timer);clearTimeout(SES.wait);voiceUnlisten();SES.onVoiceErr=null;
  if(SES.part===1)topUp1();
  const card=SES.q.shift();SES.cur=card;
  if(!card){finishSession();return;}
  if(SES.part===1)renderCard1(card);else renderCard2(card);
}
function finishSession(){
  const s=SES;endSession(true);const c=counts();
  $('#main').innerHTML=`<div class="card"><h2>Xong phiên học</h2>
   <p>Số lần trả lời: <b>${s.ans}</b> · đúng: <b>${s.ok}</b> (${s.ans?Math.round(s.ok/s.ans*100):0}%).</p>
   <p>${s.part===1?`Câu mới thuộc trong phiên: <b>${s.mastered}</b> · câu đã ôn: <b>${s.revDone}</b>.`:`Câu đạt phần nói trong phiên: <b>${s.mastered}</b> · câu đã ôn: <b>${s.revDone}</b>.`}</p>
   <p>Tổng đã thuộc nghĩa: <b>${fmtN(c.m1)}</b> / ${fmtN(N)} · đã nói đạt: <b>${fmtN(c.m2)}</b>.</p>
   ${s.part===1?(c.due1||c.learn1||quota()>0&&c.seen<N?'<button class="btn" id="cont">Học tiếp phiên mới</button> ':'<button class="btn" id="more">Học thêm 20 câu mới</button> ')+'<button class="btn sec" id="g2">Sang Phần 2: Luyện nói</button>':'<button class="btn" id="again">Luyện nói tiếp</button>'}
   <button class="btn sec" id="gh">Về Tổng quan</button></div>`;
  if($('#more'))$('#more').onclick=()=>{S.day.extra+=20;save();startP1();};
  if($('#g2'))$('#g2').onclick=()=>go('p2');
  if($('#again'))$('#again').onclick=()=>startP2();
  if($('#cont'))$('#cont').onclick=()=>startP1();
  $('#gh').onclick=()=>go('home');
}
function headerHTML(card,label){
  const p=sesProgress();const pct=p.tot?Math.round(p.done/p.tot*100):100;
  const tag=card.rev?'<span class="badge rev">Ôn tập</span>':(card.dir==='pv'?'<span class="badge new">Câu mới</span>':'');
  return `<div class="toprow"><span>${tag} ${esc(lessonName(LESSON_OF[card.id]))}</span><span>Phiên: ${p.done}/${p.tot} câu xong · còn ${SES.q.length+1} lượt</span></div>
  <div class="bar" style="margin-top:4px"><i style="width:${pct}%"></i></div>
  <div class="label" style="margin-top:10px">${label}</div>`;
}
function toolsHTML(id,extra){
  const f=S.it[id]&&S.it[id].f;
  return `<div class="tools">${extra||''}<button class="btn sec small" id="tSpk">Nghe lại (Space)</button>
   <button class="btn sec small ${f?'on':''}" id="tFlag">${f?'Đã đánh dấu ôn lại':'Cần ôn lại (M)'}</button>
   <button class="btn sec small" id="tEnd">Kết thúc phiên</button></div>`;
}
function bindTools(id){
  $('#tSpk').onclick=()=>replay();
  $('#tFlag').onclick=()=>toggleFlag();
  $('#tEnd').onclick=()=>{endSession(true);render();};
  if($('#tPause'))$('#tPause').onclick=()=>togglePause();
}
function toggleFlag(){if(!SES||!SES.cur)return;const id=SES.cur.id;const on=!(S.it[id]&&S.it[id].f);setFlag(id,on);
  const b=$('#tFlag');if(b){b.classList.toggle('on',on);b.textContent=on?'Đã đánh dấu ôn lại':'Cần ôn lại (M)';}
  toast(on?'Đã đánh dấu: câu này sẽ quay lại ngày mai và sau 3, 7, 15 ngày':'Đã bỏ đánh dấu');}
function replay(){if(!SES||!SES.cur)return;const c=SES.cur;
  if(SES.part===1&&c.dir==='ve'&&!SES.answered){toast('Chiều Việt → Anh: nghe sau khi trả lời');return;}
  if(SES.part===2){if(SES.phase==='listen')return;speak(EN(c.id));return;}
  speak(EN(c.id));}

function renderCard1(card){
  const id=card.id;SES.answered=false;SES.paused=false;SES.vAttempt=0;SES.vLast=null;SES.vHeard='';SES.vHold=false;
  if(card.dir==='pv'){
    $('#main').innerHTML=`<div class="card">${headerHTML(card,'Câu mới – đọc và nghe kỹ, rồi bấm Tiếp')}
     <div class="prompt">${esc(EN(id))}</div><div class="ipa">${esc(IPA(id))}</div>
     <div class="prompt vi" style="font-weight:500;margin-top:8px">${esc(VI(id))}</div>
     ${PART(id)?'<div class="muted">(Nghĩa tiếng Việt ở đây là nghĩa của mẫu câu)</div>':''}
     <p><button class="btn" id="nx">Tiếp (Enter)</button></p>${toolsHTML(id)}</div>`;
    $('#nx').onclick=()=>{SES.q.length;nextCard();};bindTools(id);SES.answered=true;speak(EN(id));return;
  }
  const mc=makeOptions(id,card.dir);SES.mc=mc;
  const ev=card.dir==='ev',vOn=voiceOn();
  const label=ev?'Chọn nghĩa tiếng Việt đúng':(PART(id)?'Chọn câu tiếng Anh dùng đúng mẫu câu này':'Chọn câu tiếng Anh đúng');
  $('#main').innerHTML=`<div class="card" id="qc">${headerHTML(card,label)}
    <div class="prompt ${ev?'':'vi'}">${esc(ev?EN(id):VI(id))}</div>${ev?`<div class="ipa">${esc(IPA(id))}</div>`:''}
    <div class="tbar" id="tb"><i></i></div><div class="toprow"><span id="tl">${vOn?'Nghe máy đọc…':S.set.secs+' giây'}</span><span class="kbd">1–4 / A–D${vOn?(ev?' · hoặc nói nghĩa':' · hoặc nói câu tiếng Anh'):''}</span></div>
    <div class="opts">${mc.opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${'ABCD'[k]}</b><span>${esc(ev?VI(o):EN(o))}</span></button>`).join('')}</div>
    <div class="vbox ${vOn?'on':'hide'}" id="vbox">${vOn?(ev?'🎤 Nghe máy đọc xong rồi nói nghĩa tiếng Việt (hoặc bấm A–D).':'🎤 Nói câu tiếng Anh (hoặc bấm A–D).'):''}</div>
    <div class="fb" id="fb"></div>
    ${toolsHTML(id,'<button class="btn sec small" id="tPause">⏸ Tạm dừng (P)</button>'+voiceBtnHTML())}</div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose1(+b.dataset.k));
  bindTools(id);$('#tVoice').onclick=()=>setVoice(!voiceOn());
  if(vOn&&ev){ // đọc câu tiếng Anh xong mới bắt đầu nghe; giờ tính từ lúc bắt đầu nghe
    speak(EN(id),()=>setTimeout(()=>{if(SES&&SES.cur===card&&!SES.answered&&!SES.paused)p1Listen(card);},GAP));return;}
  if(vOn){stopSpeak();setTimeout(()=>{if(SES&&SES.cur===card&&!SES.answered&&!SES.paused)p1Listen(card);},GAP);return;} // Việt → Anh: tắt tiếng máy (tránh máy tự "nghe" tiếng Anh của chính nó) rồi nghe ngay
  if(ev)speak(EN(id));
  startTimer(S.set.secs,()=>choose1(-1));
}
function startTimer(secs,onTimeout){
  clearInterval(SES.timer);SES.tLeft=secs*1000;SES.tTotal=secs*1000;let last=performance.now();
  const upd=()=>{const i=document.querySelector('#tb>i');if(i)i.style.width=Math.max(0,SES.tLeft/SES.tTotal*100)+'%';
    const tb=$('#tb');if(tb)tb.classList.toggle('low',SES.tLeft<3000);const tl=$('#tl');if(tl)tl.textContent=SES.paused?'Đang tạm dừng':SES.vHold?'Đang nghe bạn nói…':Math.ceil(SES.tLeft/1000)+' giây';};
  upd();
  SES.timer=setInterval(()=>{const n=performance.now();if(!SES.paused&&!SES.vHold)SES.tLeft-=n-last;last=n;upd();
    if(SES.tLeft<=0){clearInterval(SES.timer);onTimeout();}},100);
}
function togglePause(){
  if(!SES||!SES.cur)return;SES.paused=!SES.paused;const b=$('#tPause');if(b)b.textContent=SES.paused?'▶ Tiếp tục (P)':'⏸ Tạm dừng (P)';
  if(SES.part===1){
    if(SES.answered){if(SES.paused){clearTimeout(SES.wait);toast('Đã tạm dừng – bấm Tiếp tục (P) để sang câu kế');}else nextCard();return;}
    document.querySelectorAll('.opt').forEach(o=>o.disabled=SES.paused);
    if(voiceOn()&&SES.cur.dir!=='pv'){if(SES.paused){voiceUnlisten();stopSpeak();vbSet('⏸ Đã tạm dừng – máy không nghe. Bấm “Tiếp tục (P)” để nghe tiếp.');}else p1Listen(SES.cur);}
    return;}
  if(SES.paused){clearTimeout(SES.wait);clearInterval(SES.timer);voiceUnlisten();stopSpeak();SES.onVoiceErr=null;const tl=$('#tl');if(tl)tl.textContent='⏸ Đang tạm dừng';}
  else{if(SES.p2done)nextCard();else renderCard2(SES.cur);}
}
function choose1(k,how){
  if(!SES||SES.answered||(SES.paused&&k>=0))return;SES.answered=true;clearInterval(SES.timer);voiceUnlisten();
  const card=SES.cur,id=card.id,mc=SES.mc,ok=k===mc.correct;
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,i)=>{b.disabled=true;if(i===mc.correct)b.classList.add('ok');else if(i===k)b.classList.add('bad');else b.classList.add('dim');});
  answer1(card,ok);
  const fb=$('#fb');
  if(ok){fb.className='fb ok';fb.textContent='Đúng!';$('#qc').classList.add('flash');
    if(how&&how.heard){vbSet(`🎤 Bạn nói: “<span class="heard">${esc(how.heard)}</span>” – khớp ${how.j.c}%.`);SES.wait=setTimeout(nextCard,1200);}else SES.wait=setTimeout(nextCard,650);}
  else{fb.className='fb bad';if($('#vbox')&&voiceOn())vbSet(SES.vHeard?`Máy nghe được: “<span class="heard">${esc(SES.vHeard)}</span>”`:'Máy chưa nghe được gì.');
    fb.innerHTML=(k<0?'Hết giờ. ':'Chưa đúng. ')+`Đáp án: <span style="color:#1f2937">${esc(EN(id))}</span> <span class="ipa">${esc(IPA(id))}</span><br><span style="color:#1f2937;font-weight:500">${esc(VI(id))}</span><div class="muted" style="font-weight:400">Câu này sẽ quay lại sau vài câu. Bấm Enter để đi tiếp.</div>`;
    const t0=Date.now();let spoke=false;
    speak(EN(id),()=>{spoke=true;});
    const tryNext=()=>{if(!SES||SES.cur!==card)return;if(Date.now()-t0>=2200&&(spoke||Date.now()-t0>6000))nextCard();else SES.wait=setTimeout(tryNext,200);};
    SES.wait=setTimeout(tryNext,2200);
  }
}

/* --- Phần 1: trả lời bằng giọng nói (cả 2 chiều) ---
   Anh → Việt: máy đọc câu tiếng Anh, người học nói NGHĨA TIẾNG VIỆT (nhận giọng vi-VN, đạt >= 90%).
   Việt → Anh: người học nói CÂU TIẾNG ANH (nhận giọng en-US, chấm từng từ như Phần 2, đạt >= 80%). */
function vLang(card){return card.dir==='ev'?'vi-VN':'en-US';}
function vScore(card,t){return card.dir==='ev'?scoreVi(card.id,t):scoreSpeech(EN(card.id),t).pct;}
function vJudge(card,t){return card.dir==='ev'?judgeVi(card.id,SES.mc,t):judgeEn(card.id,SES.mc,t);}
function vRefLen(card){return card.dir==='ev'?Math.min.apply(null,viRefs(card.id).map(r=>r.length)):tokens(spoken(EN(card.id))).length;}
function vHearLen(card,t){return card.dir==='ev'?viToks(t).length:tokens(t).length;}
function marksHTML(r){return r.marks.map(m=>m.t==='ok'?`<span class="w-ok">${esc(m.w)}</span>`:m.t==='bad'?`<span class="w-bad" title="${m.said?'máy nghe: '+esc(m.said):'thiếu'}">${esc(m.w)}</span>`:`<span class="w-x">${esc(m.w)}</span>`).join(' ');}
function voiceOn(){return !!(S.set.voiceAns&&SR);}
function voiceBtnHTML(id){const on=voiceOn();return `<button class="btn sec small vt ${on?'on':''}" id="${id||'tVoice'}" aria-pressed="${on}">🎤 Trả lời bằng giọng nói: ${on?'Bật':'Tắt'}</button>`;}
function refreshVoiceBtns(){const on=voiceOn();document.querySelectorAll('.vt').forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.textContent='🎤 Trả lời bằng giọng nói: '+(on?'Bật':'Tắt');});
  const n=$('#vnote');if(n)n.innerHTML=on&&IS_FILE?`<div class="msg">${FILE_NOTE}</div>`:'';}
function setVoice(on){
  if(on&&!SR){toast('Trình duyệt này không nhận được giọng nói. Hãy dùng Chrome hoặc Edge.');return;}
  S.set.voiceAns=!!on;save();refreshVoiceBtns();
  if(!on){voiceStop();const vb=$('#vbox');if(vb){vb.className='vbox hide';vb.innerHTML='';}toast('Đã tắt micro');return;}
  const c=SES&&SES.part===1&&SES.cur;
  if(SES&&SES.part===2&&SES.cur&&!SES.answered){voiceStart('en-US');renderCard2(SES.cur);}
  else if(c&&(c.dir==='ev'||c.dir==='ve')&&!SES.answered){stopSpeak();voiceStart(vLang(c));VOICE.autoUsed=true;p1Listen(c);}
  toast(IS_FILE?'Đã bật. Mở bằng MO_TOOL.bat để Chrome không hỏi lại quyền micro.':'Đã bật trả lời bằng giọng nói');
}
function vbSet(html,on){const vb=$('#vbox');if(!vb)return;vb.className='vbox'+(on?' on':'');vb.innerHTML=html;}
function p1Listen(card){
  if(!SES||SES.cur!==card||SES.answered||SES.paused||!voiceOn()||(card.dir!=='ev'&&card.dir!=='ve'))return;
  const lang=vLang(card),ev=card.dir==='ev';
  SES.vFinals=[];SES.vHold=false;SES.vHeard='';SES.vShortWait=false;
  SES.onVoiceErr=err=>{if(!SES||SES.cur!==card||SES.answered)return;if(err==='no-speech'||err==='aborted')return;
    const m={'not-allowed':'Chưa được cấp quyền micro.','service-not-allowed':'Trình duyệt chặn dịch vụ nhận giọng nói.','network':'Mất mạng: nhận giọng nói cần Internet.','audio-capture':'Không thu được âm thanh từ micro.'}[err]||('Lỗi nhận giọng nói: '+err);
    vbSet(`<span class="vErr">${esc(m)}</span> Bạn vẫn bấm A–D như bình thường. <button class="btn sec small" id="vRe">🎤 Thử lại micro</button>`);
    const b=$('#vRe');if(b)b.onclick=()=>{voiceStart(lang);p1Listen(card);};};
  if(!voiceEnsure(lang)){
    vbSet(`Micro đang nghỉ. <button class="btn small" id="vGo">🎤 Bấm để nói</button> <span class="muted">hoặc bấm A–D.</span><div class="muted" style="font-size:15px;margin-top:4px">${FILE_NOTE}</div>`);
    $('#vGo').onclick=()=>{voiceStart(lang);p1Listen(card);};
  }else{
    vbSet(`🎤 <b>Đang nghe…</b> ${ev?'Hãy nói <b>nghĩa tiếng Việt</b>':'Hãy nói <b>câu tiếng Anh</b>'} (hoặc bấm A–D).${SES.vAttempt?' <span class="muted">(lần nói lại)</span>':''}<div id="vlive" class="vlive"></div>`,true);
    voiceListen(e=>p1OnResult(card,e));
  }
  startTimer(Math.max(S.set.vsecs|0,S.set.secs|0),()=>p1VoiceTimeout(card));
}
function p1OnResult(card,e){
  if(!SES||SES.cur!==card||SES.answered)return;
  let interim='',gotFinal=false;
  for(let i=Math.max(e.resultIndex|0,VOICE.base);i<e.results.length;i++){const r=e.results[i];
    if(r.isFinal){let bt=r[0].transcript,bc=-1;for(let a=0;a<r.length;a++){const t=r[a].transcript;const c=vScore(card,(SES.vFinals.join(' ')+' '+t).trim());if(c>bc){bc=c;bt=t;}}
      SES.vFinals.push(String(bt).trim());VOICE.base=i+1;gotFinal=true;}
    else interim+=r[0].transcript;}
  interim=interim.trim();
  const heard=(SES.vFinals.join(' ')+' '+interim).trim();SES.vHold=!!interim;SES.vHeard=heard;
  const lv=$('#vlive');if(lv)lv.textContent=heard?'Máy nghe được: “'+heard+'”':'';
  if(!heard)return;
  const j=vJudge(card,heard);
  if(j.ok&&(!interim||j.c>=90)){choose1(SES.mc.correct,{heard,j});return;}
  if(gotFinal&&!interim){
    // câu nói còn quá ngắn (người học ngắt hơi giữa chừng) thì chờ nói tiếp, chưa tính là một lần nói
    const refLen=vRefLen(card);
    if(!j.closer&&vHearLen(card,heard)<Math.ceil(refLen*0.5)&&!SES.vShortWait){SES.vShortWait=true;return;}
    SES.vShortWait=false;p1VoiceMiss(card,heard,j);}
}
function p1VoiceMiss(card,heard,j){
  SES.vAttempt=(SES.vAttempt|0)+1;SES.vLast={heard,j};
  if(SES.vAttempt>=2){p1VoiceWrong(card,heard,j);return;}
  voiceUnlisten();SES.vFinals=[];
  vbSet(`Máy nghe được: “<span class="heard">${esc(heard)}</span>” – <b>chưa khớp</b>${j.closer?' (giống một đáp án khác hơn)':''}.
   Bạn được <b>nói lại 1 lần</b> (không bị tính sai), hoặc bấm A–D.
   <div style="margin-top:6px"><button class="btn small" id="vRe">🎤 Nói lại</button></div><div id="vlive" class="vlive"></div>`,true);
  $('#vRe').onclick=()=>p1Listen(card);
  // vẫn nghe tiếp ngay, không cần bấm
  SES.vFinals=[];voiceListen(e=>p1OnResult(card,e));
  startTimer(Math.max(S.set.vsecs|0,S.set.secs|0),()=>p1VoiceTimeout(card));
}
function p1VoiceTimeout(card){
  if(!SES||SES.cur!==card||SES.answered)return;
  const h=SES.vHeard||(SES.vLast&&SES.vLast.heard);
  if(h){p1VoiceWrong(card,h,vJudge(card,h));return;}
  choose1(-1);
}
function snap1(id){return {id,o:S.it[id]?JSON.parse(JSON.stringify(S.it[id])):null,q:SES.q.slice(),active:new Set(SES.active),tl:SES.targetLearn,rd:SES.revDone,ms:SES.mastered,
  ans:SES.ans,ok:SES.ok,st:Object.assign({},S.stats),da:S.day.ans,nl:SES.newLeft,lp:SES.learnPool.slice(),neu:S.day.neu};}
function restore1(s){if(s.o)S.it[s.id]=s.o;else delete S.it[s.id];SES.q=s.q;SES.active=s.active;SES.targetLearn=s.tl;SES.revDone=s.rd;SES.mastered=s.ms;
  SES.ans=s.ans;SES.ok=s.ok;S.stats=s.st;S.day.ans=s.da;SES.newLeft=s.nl;SES.learnPool=s.lp;S.day.neu=s.neu;}
function p1VoiceWrong(card,heard,j){
  if(!SES||SES.cur!==card||SES.answered)return;SES.answered=true;clearInterval(SES.timer);voiceUnlisten();
  const id=card.id,mc=SES.mc;const snap=snap1(id);
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===mc.correct)b.classList.add('ok');else if(j&&j.closer&&i===j.wk)b.classList.add('bad');else b.classList.add('dim');});
  answer1(card,false);
  vbSet(`Máy nghe được: “<span class="heard">${esc(heard)}</span>” – khớp ${j?j.c:0}%${j&&j.closer?' (giống đáp án '+'ABCD'[j.wk]+' hơn)':''}.`+
    (j&&j.r?`<div style="margin-top:4px">So từng từ: ${marksHTML(j.r)}</div><div class="muted" style="font-size:14px">Xanh: đúng · đỏ gạch chân: sai/thiếu · xám gạch ngang: từ thừa.</div>`:''));
  const fb=$('#fb');fb.className='fb bad';
  fb.innerHTML=`Chưa đúng. ${card.dir==='ev'?'Nghĩa đúng':'Câu đúng'}: <span style="color:#1f2937">${esc(card.dir==='ev'?VI(id):EN(id))}</span><br><span style="color:#1f2937;font-weight:500">${esc(card.dir==='ev'?EN(id):VI(id))}</span> <span class="ipa">${esc(IPA(id))}</span>
   <div class="muted" style="font-weight:400">Câu này sẽ quay lại sau vài câu. Nếu bạn nói đúng mà máy nghe nhầm, bấm “Tính là đúng”. Tự sang câu tiếp sau 6 giây (P: tạm dừng).</div>
   <div style="margin-top:6px"><button class="btn ok2" id="vOk">✔ Tính là đúng</button> <button class="btn sec" id="vNext">Câu tiếp (Enter)</button></div>`;
  speak(EN(id));
  $('#vNext').onclick=()=>nextCard();
  SES.wait=setTimeout(()=>{if(SES&&SES.cur===card&&!SES.paused)nextCard();},6000);
  $('#vOk').onclick=()=>{if(!SES||SES.cur!==card)return;clearTimeout(SES.wait);restore1(snap);answer1(card,true);
    document.querySelectorAll('.opt').forEach(b=>b.classList.remove('bad'));
    fb.className='fb ok';fb.textContent='Đã tính là đúng.';toast('Đã tính là đúng');SES.wait=setTimeout(nextCard,700);};
}

  rollDay();const c=counts();

   <p>Chỉ những câu đã thuộc ở Phần 1 mới được luyện nói. Hiện có <b>${c.avail2}</b> câu chờ luyện nói và <b>${c.due2}</b> câu cần ôn.</p>
   <p>Cách làm: máy đọc câu mẫu → bạn đọc lại trong ${S.set.p2secs} giây → máy so từng từ. Đạt từ ${PASS}% trở lên là qua và tự sang câu kế. Chưa đạt thì câu quay lại sau 3–5 câu. Đạt 2 lần liên tiếp là xong câu đó.</p>
   ${!SR?'<div class="msg err">Trình duyệt này không hỗ trợ nhận giọng nói. Hãy mở file bằng <b>Google Chrome</b> hoặc <b>Microsoft Edge</b> (cần có mạng Internet và micro).</div>':''}

function showMicErr(t){const m=$('#micmsg')||$('#main');m.insertAdjacentHTML('beforeend',`<div class="msg err">${esc(t)}</div>`);}
function startP2(){
  if(!SR){toast('Cần Chrome hoặc Edge');return;}
  if(!voiceOn())setVoice(true); // bấm "Bắt đầu (bật micro)" = đồng ý bật micro
  voiceStart('en-US');VOICE.autoUsed=true;fileNoteOnce();
  rollDay();const t=dayNum();const rev=[],learn=[];
  for(const k in S.it){const o=S.it[k];if(o.m2){if(dueOf(o,2)<=t)rev.push(+k);}else if(o.m1)learn.push(+k);}
  learn.sort((a,b)=>a-b);
  if(S.focus>=0)learn.sort((a,b)=>((LESSON_OF[a]===S.focus)?0:1)-((LESSON_OF[b]===S.focus)?0:1)||a-b);
  shuffle(rev);
  const ch=S.set.chunk>0?S.set.chunk:1e9;rev.splice(ch);learn.splice(Math.max(0,ch-rev.length));
  SES={view:'p2',part:2,q:[],learnPool:learn,active:new Set(),revTotal:rev.length,revDone:0,mastered:0,targetLearn:learn.length,ans:0,ok:0,cur:null};
  rev.forEach(i=>SES.q.push({id:i,dir:'sp',rev:1}));
  topUp2();nextCard();
}
function topUp2(){
  while(SES.active.size<WS&&SES.learnPool.length){const id=SES.learnPool.shift();SES.active.add(id);SES.q.push({id,dir:'sp'});}
}
function answer2(card,pass){
  const o=it(card.id);SES.ans++;if(pass)SES.ok++;S.stats.ans++;if(pass)S.stats.ok++;S.day.ans++;touchStreak();
  if(card.rev){SES.revDone++;
    if(pass)o.s2=(o.s2|0)+1;
    else{o.m2=0;o.c2=0;SES.active.add(card.id);SES.targetLearn++;insertAt({id:card.id,dir:'sp'},rint(3,5));}
  }else{
    if(pass){o.c2=(o.c2|0)+1;if(o.c2>=NEED){master2(card.id);SES.active.delete(card.id);SES.mastered++;topUp2();}else insertAt({id:card.id,dir:'sp'},rint(5,8));}
    else{o.c2=0;insertAt({id:card.id,dir:'sp'},rint(3,5));}
  }
  save();
}
function renderCard2(card){
  const id=card.id;SES.answered=false;SES.phase='play';SES.p2try=0;SES.p2done=false;SES.paused=false;
  const hide=S.set.hideEn2;
  $('#main').innerHTML=`<div class="card" id="qc">${headerHTML(card,'Nghe câu mẫu rồi đọc lại')}
   <div class="prompt" id="enTxt">${hide?'<span class="muted">(Đã ẩn câu tiếng Anh – nghe và nhắc lại)</span>':esc(EN(id))}</div>
   <div class="ipa">${hide?'':esc(IPA(id))}</div><div style="margin-top:4px">${esc(VI(id))}</div>
   <div class="tbar" id="tb"><i></i></div><div class="toprow"><span id="tl">Đang phát câu mẫu…</span><span id="st2"></span></div>
   <div id="live" class="muted" style="min-height:26px"></div>
   <div id="res"></div>
   ${toolsHTML(id,'<button class="btn sec small" id="tPause">⏸ Tạm dừng (P)</button><button class="btn sec small" id="tSkip">Bỏ qua câu này</button>'+voiceBtnHTML())}</div>`;
  bindTools(id);$('#tVoice').onclick=()=>setVoice(!voiceOn());
  $('#tSkip').onclick=()=>{voiceUnlisten();if(!SES.answered){SES.answered=true;SES.q.push(card);nextCard();}};
  speak(EN(id),()=>setTimeout(()=>{if(SES&&SES.cur===card&&!SES.answered&&!SES.paused)listen(card);},GAP));

function listen(card){
  if(!voiceOn()){const tl=$('#tl');if(tl)tl.textContent='Micro đang tắt';const r=$('#res');if(r)r.innerHTML='<div class="msg">Micro đang tắt. Bật “🎤 Trả lời bằng giọng nói” để luyện nói.</div>';return;}
  SES.phase='listen';const secs=S.set.p2secs;let best={pct:0,text:''},finals=[],interim='',done=false;
  const tl=$('#tl');
  if(!voiceEnsure('en-US')){SES.phase='wait';if(tl)tl.textContent='Micro đang nghỉ';
    const r=$('#res');if(r)r.innerHTML=`<div class="msg">Micro đã tự ngắt. <button class="btn" id="mGo">🎤 Bấm để đọc</button><div style="font-size:15px;margin-top:4px">${FILE_NOTE}</div></div>`;
    if($('#mGo'))$('#mGo').onclick=()=>{$('#res').innerHTML='';voiceStart('en-US');listen(card);};return;}
  if(tl)tl.textContent='Mời bạn đọc…';
  const evalText=(txt)=>{const r=scoreSpeech(EN(card.id),txt);if(r.pct>=best.pct)best={pct:r.pct,text:txt};return r;};
  const finish=(why)=>{if(done)return;done=true;clearInterval(SES.timer);voiceUnlisten();SES.onVoiceErr=null;
    if(why==='err')return;
    const all=(finals.join(' ')+' '+interim).trim();if(all)evalText(all);showResult2(card,best);};
  voiceListen(e=>{if(done||!SES||SES.cur!==card)return;interim='';
    for(let i=Math.max(e.resultIndex|0,VOICE.base);i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal){let bt=r[0].transcript,bp=-1;for(let a=0;a<r.length;a++){const p=scoreSpeech(EN(card.id),(finals.join(' ')+' '+r[a].transcript).trim()).pct;if(p>bp){bp=p;bt=r[a].transcript;}}finals.push(bt);VOICE.base=i+1;}
      else interim+=r[0].transcript;}
    const cur=(finals.join(' ')+' '+interim).trim();const lv=$('#live');if(lv)lv.textContent='Máy nghe được: '+cur;
    const sc=evalText(cur);if(finals.length&&sc.pct>=PASS&&!interim)finish('pass');});
  SES.onVoiceErr=err=>{if(done||err==='no-speech'||err==='aborted')return;
    const m={'not-allowed':'Chưa được cấp quyền micro (hoặc trang bị chặn nhận giọng nói).','service-not-allowed':'Trình duyệt chặn dịch vụ nhận giọng nói.','network':'Mất kết nối mạng: nhận giọng nói cần Internet.','audio-capture':'Không thu được âm thanh từ micro.'}[err]||('Lỗi nhận giọng nói: '+err);
    finish('err');
    const r=$('#res');if(r)r.innerHTML=`<div class="msg err">${esc(m)} Câu này không bị tính sai.</div><button class="btn" id="retry">Thử lại câu này</button>`;
    if($('#retry'))$('#retry').onclick=()=>{voiceStart('en-US');renderCard2(card);};};
  startTimer(secs,()=>finish('time'));
  SES.finishListen=()=>finish('enter');
}
function showResult2(card,best){
  if(!SES||SES.cur!==card)return;SES.answered=true;SES.phase='result';
  const r=scoreSpeech(EN(card.id),best.text);const pass=r.pct>=PASS;
  const retry=!pass&&!SES.p2try; // sai lần đầu: nghe lại mẫu, đọc lại (không tính)
  if(!retry){answer2(card,pass);SES.p2done=true;}
  const words=r.marks.map(m=>m.t==='ok'?`<span class="w-ok">${esc(m.w)}</span>`:m.t==='bad'?`<span class="w-bad" title="${m.said?'máy nghe: '+esc(m.said):'thiếu'}">${esc(m.w)}</span>`:`<span class="w-x">${esc(m.w)}</span>`).join(' ');
  const o=S.it[card.id]||{};
  $('#res').innerHTML=`<div class="score" style="color:${pass?'#166534':'#991b1b'}">${r.pct}% – ${pass?'Đạt':'Chưa đạt'}</div>
   <div>So sánh từng từ: ${words||'<span class="muted">(máy không nghe được gì)</span>'}</div>
   <div class="muted" style="font-size:15px">Màu xanh: đúng · đỏ gạch chân: sai/thiếu · xám gạch ngang: từ thừa. Máy nghe được: "${esc(best.text||'')}"</div>
   <div class="fb ${pass?'ok':'bad'}">${pass?(o.m2&&!card.rev?'Câu này đã đạt phần nói!':'Tốt! Tự sang câu tiếp…'):(retry?'Chưa đạt – máy đọc lại câu mẫu, bạn đọc lại lần nữa (lần này chưa bị tính).':'Câu này sẽ quay lại sau vài câu (3–5 câu nếu còn đủ câu). Tự sang câu tiếp…')}</div>`;
  const tl=$('#tl');if(tl)tl.textContent='Đã chấm';const lv=$('#live');if(lv)lv.textContent='';
  if(pass)SES.wait=setTimeout(nextCard,1400);
  else if(retry){SES.p2try=1;SES.wait=setTimeout(()=>{if(!SES||SES.cur!==card||SES.paused)return;SES.answered=false;SES.phase='play';
      const tl=$('#tl');if(tl)tl.textContent='Đang phát lại câu mẫu…';
      speak(EN(card.id),()=>setTimeout(()=>{if(SES&&SES.cur===card&&!SES.answered&&!SES.paused)listen(card);},GAP));},2200);}
  else SES.wait=setTimeout(nextCard,4500);
}

/* ===== Danh sách bài ===== */
function renderLessons(){
  const st=L=>{let a=0,b=0;for(let j=L[2];j<L[2]+L[3];j++){const o=S.it[j];if(o){if(o.m1)a++;if(o.m2)b++;}}return [a,b];};
  let h='<div class="card"><h2>Danh sách bài</h2><p class="muted">Bấm "Học bài này" để ưu tiên lấy câu mới từ bài đó (vẫn tính vào số câu mới của ngày). Bấm "Xem câu" để nghe và xem toàn bộ câu.</p>';
  const fl=Object.keys(S.it).filter(k=>S.it[k].f).map(Number).sort((a,b)=>a-b);
  h+=`<details><summary><b>Câu đã đánh dấu "Cần ôn lại" (${fl.length})</b></summary>${fl.map(i=>sentRow(i)).join('')||'<p class="muted">Chưa có.</p>'}</details>`;
  let lastSec=-1;
  LES.forEach((L,li)=>{if(L[0]!==lastSec){lastSec=L[0];h+=`<div class="sec-h">${esc(SECS[L[0]])}</div>`;}
    const [a,b]=st(L);
    h+=`<div class="les"><span class="t">${S.focus===li?'<b>▶ </b>':''}${esc(L[1])}</span><span class="p">Nghĩa ${a}/${L[3]} · Nói ${b}/${L[3]}</span>
      <button class="btn small" data-learn="${li}">Học bài này</button><button class="btn sec small" data-view="${li}">Xem câu</button></div><div id="lv${li}"></div>`;});
  h+='</div>';$('#main').innerHTML=h;
  document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{S.focus=+b.dataset.learn;save();go('p1');});
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const li=+b.dataset.view,box=$('#lv'+li);
    if(box.innerHTML){box.innerHTML='';return;}const L=LES[li];let s='';for(let j=L[2];j<L[2]+L[3];j++)s+=sentRow(j);box.innerHTML=s;bindRows(box);});
  bindRows($('#main'));
}
function sentRow(i){const o=S.it[i]||{};
  return `<div class="sl"><div class="e">${esc(EN(i))} <button class="btn sec small" data-say="${i}">Nghe</button>
   <button class="btn sec small ${o.f?'on':''}" data-flag="${i}">${o.f?'Bỏ đánh dấu':'Cần ôn lại'}</button></div>
   <div class="ipa">${esc(IPA(i))}</div><div>${esc(VI(i))}</div>
   <div class="muted" style="font-size:14px">${o.m1?'Đã thuộc nghĩa':o.sn?'Đang học':'Chưa học'}${o.m2?' · Đã nói đạt':''}</div></div>`;}
function bindRows(root){root.querySelectorAll('[data-say]').forEach(b=>{if(b._b)return;b._b=1;b.onclick=()=>speak(EN(+b.dataset.say));});
  root.querySelectorAll('[data-flag]').forEach(b=>{if(b._b)return;b._b=1;b.onclick=()=>{const i=+b.dataset.flag;const on=!(S.it[i]&&S.it[i].f);setFlag(i,on);b.textContent=on?'Bỏ đánh dấu':'Cần ôn lại';b.classList.toggle('on',on);};});}

/* ===== Cài đặt ===== */
function renderSettings(){
  const vs=enVoices();const cur=pickVoice();
  $('#main').innerHTML=`<div class="card"><h2>Cài đặt</h2>
   <label class="row">Số câu mới mỗi ngày: <input type="number" id="sDaily" min="5" max="1000" value="${S.set.daily}"> <span class="muted" id="sPlan"></span></label>
   <label class="row">Thời gian mỗi câu Phần 1 (giây): <input type="number" id="sSecs" min="3" max="60" value="${S.set.secs}"></label>
   <label class="row">Thời gian đọc Phần 2 (giây): <input type="number" id="sP2" min="4" max="30" value="${S.set.p2secs}"></label>
   <label class="row">Tốc độ đọc mẫu: <select id="sRate">${[0.7,0.8,0.9,1].map(r=>`<option value="${r}" ${S.set.rate==r?'selected':''}>${r===1?'Bình thường':r===0.9?'Hơi chậm':r===0.8?'Chậm':'Rất chậm'} (${r})</option>`).join('')}</select>
     <button class="btn sec small" id="sTest">Nghe thử</button></label>
   <label class="row">Giọng đọc: <select id="sVoice"><option value="">Tự chọn giọng Mỹ tốt nhất${cur?' ('+esc(cur.name)+')':''}</option>${vs.map(v=>`<option ${S.set.voice===v.name?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
   <label class="row">Số câu mỗi phiên (học ngắn, nghỉ giữa phiên; 0 = không giới hạn): <input type="number" id="sChunk" min="0" max="500" value="${S.set.chunk}"></label>
   <label class="row"><input type="checkbox" id="sPrev" ${S.set.preview?'checked':''}> Xem trước câu mới (hiện cả nghĩa) trước khi hỏi</label>
   <label class="row"><input type="checkbox" id="sVA" ${voiceOn()?'checked':''} ${SR?'':'disabled'}> 🎤 Trả lời bằng giọng nói (Phần 1, cả 2 chiều: Anh → Việt nói nghĩa tiếng Việt, Việt → Anh nói câu tiếng Anh; vẫn bấm A–D được). Mặc định tắt – micro chỉ bật khi bạn chọn.</label>
   <label class="row">Thời gian mỗi câu khi trả lời bằng giọng nói (giây): <input type="number" id="sVS" min="5" max="60" value="${S.set.vsecs}"></label>
   <label class="row">Mức đạt khi nói nghĩa tiếng Việt (Anh → Việt), %: <input type="number" id="sPV" min="50" max="100" value="${passVi()}"></label>
   <label class="row">Mức đạt khi nói câu tiếng Anh (Việt → Anh), %: <input type="number" id="sPE" min="50" max="100" value="${passEn()}"></label>
   <div id="vnote">${voiceOn()&&IS_FILE?`<div class="msg">${FILE_NOTE}</div>`:''}</div>
   <label class="row"><input type="checkbox" id="sHide" ${S.set.hideEn2?'checked':''}> Phần 2: ẩn câu tiếng Anh (chỉ nghe rồi nhắc lại – khó hơn)</label>
  </div>
  <div class="card"><h2>Sao lưu tiến độ</h2>
   <p class="muted">Tiến độ được lưu tự động trong trình duyệt của máy này. Nên "Xuất file" định kỳ để giữ bản sao, hoặc để chuyển sang máy/trình duyệt khác.</p>
   <button class="btn" id="bExp">Xuất file tiến độ (.json)</button>
   <label class="btn sec">Nhập file tiến độ<input type="file" id="bImp" accept=".json,application/json" class="hide"></label>
   <button class="btn sec" id="bReset">Xóa toàn bộ tiến độ</button>
  </div>
  <div class="card"><h2>Lưu ý về micro</h2><p class="muted" style="margin:0">Phần 2 cần Chrome hoặc Edge, có Internet và micro. Micro chỉ xin quyền 1 lần mỗi lần mở file. Nếu trình duyệt có lựa chọn "Luôn cho phép" thì chọn để lần sau không hỏi nữa. Khi mở file trực tiếp từ ổ đĩa, một số trình duyệt vẫn hỏi lại mỗi lần mở file.</p></div>`;
  const plan=()=>{const d=Math.max(5,+$('#sDaily').value||0);$('#sPlan').textContent='→ xong '+fmtN(N)+' câu sau '+Math.ceil(N/d)+' ngày';};plan();
  const num=(el,key,min,max)=>{el.onchange=()=>{let v=Math.round(+el.value);if(!(v>=min))v=min;if(v>max)v=max;el.value=v;S.set[key]=v;save();plan();toast('Đã lưu');};};
  num($('#sDaily'),'daily',5,1000);$('#sDaily').oninput=plan;num($('#sSecs'),'secs',3,60);num($('#sP2'),'p2secs',4,30);num($('#sChunk'),'chunk',0,500);num($('#sVS'),'vsecs',5,60);num($('#sPV'),'passVi',50,100);num($('#sPE'),'passEn',50,100);
  $('#sVA').onchange=e=>{setVoice(e.target.checked);e.target.checked=voiceOn();};
  $('#sRate').onchange=e=>{S.set.rate=+e.target.value;save();};
  $('#sTest').onclick=()=>speak('Practice makes perfect. Let me think about it.');
  $('#sVoice').onchange=e=>{S.set.voice=e.target.value;save();};
  $('#sPrev').onchange=e=>{S.set.preview=e.target.checked;save();};
  $('#sHide').onchange=e=>{S.set.hideEn2=e.target.checked;save();};
  $('#bExp').onclick=exportProgress;
  $('#bImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const res=importProgress(r.result,true);toast(res.msg);if(res.ok)render();};r.readAsText(f);e.target.value='';};
  $('#bReset').onclick=()=>{if(confirm('Xóa toàn bộ tiến độ học? Nên xuất file sao lưu trước.')&&confirm('Chắc chắn xóa?')){S=defState();save();render();toast('Đã xóa tiến độ');}};
}
function exportJSON(){return JSON.stringify({app:'hocthuoc_en',key:KEY,count:N,exported:now().toISOString(),state:S});}
function exportProgress(){const blob=new Blob([exportJSON()],{type:'application/json'});const a=document.createElement('a');
  const d=now();a.download=`tien_do_hoc_thuoc_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.href=URL.createObjectURL(blob);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function importProgress(text,ask){
  let o;try{o=JSON.parse(text);}catch(e){return {ok:false,msg:'File không đọc được (không phải JSON).'};}
  const st=o&&o.state?o.state:o;
  if(!validState(st))return {ok:false,msg:'File không đúng định dạng tiến độ của công cụ này.'};
  if(o.count&&o.count!==N)return {ok:false,msg:'File tiến độ thuộc bộ câu khác ('+o.count+' câu).'};
  if(ask&&!confirm('Thay tiến độ hiện tại bằng tiến độ trong file?'))return {ok:false,msg:'Đã hủy nhập.'};
  S=mergeState(st);save();return {ok:true,msg:'Đã nhập tiến độ'};
}

/* ===== Phím tắt ===== */
document.addEventListener('keydown',e=>{
  if(!SES||!SES.cur)return;const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
  const k=e.key;
  if(k===' '){e.preventDefault();replay();return;}
  if(k==='m'||k==='M'){toggleFlag();return;}
  if(k==='p'||k==='P'){togglePause();return;}
  if(k==='Enter'){e.preventDefault();
    if(SES.part===1){if(SES.answered)nextCard();return;}
    if(SES.phase==='listen'&&SES.finishListen){SES.finishListen();return;}
    if(SES.answered)nextCard();return;}
  if(SES.part===1&&!SES.answered&&SES.cur.dir!=='pv'){const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[k.toLowerCase()];if(m!=null){e.preventDefault();choose1(m);}}
});
window.addEventListener('beforeunload',save);

/* ===== Lối vào cho kiểm thử ===== */
window.HT={get S(){return S;},set S(v){S=v;},get SES(){return SES;},N,LES,ITEMS,LESSON_OF,makeOptions,conflict,scoreSpeech,tokens,
  setNow:d=>{_now=d?new Date(d).getTime():null;},dayNum,dueOf,counts,quota,startP1,startP2,answer1,answer2,nextCard,choose1,setFlag,
  exportJSON,importProgress,defState,save,load:()=>{S=load();},go,OFFS,togglePause,GAP,scoreVi,judgeVi,viToks,viRefs,VOICE,voiceStart,voiceStop,setVoice,voiceOn,PASS_VI,PASS_EN,passVi,passEn,judgeEn,IS_FILE};
render();
</script>
