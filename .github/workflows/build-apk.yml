name: Build APK Kho App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai dat Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dong goi Capacitor va Plugin Giong Noi
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@6
          npx cap init "Kho Ung Dung" "com.huy.apphub" --web-dir=www
          npx cap add android

      - name: Mo quyen Micro
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n<\/manifest>/' $MANIFEST

      - name: Bien dich APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: Kho_Ung_Dung_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
