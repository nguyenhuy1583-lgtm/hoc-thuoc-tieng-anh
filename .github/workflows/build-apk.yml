name: Build APK Hoc Thuoc Tieng Anh

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai dat Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dong goi HTML bang Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Hoc Thuoc Tieng Anh" "com.huy.hocthuoctienganh" --web-dir=www
          npx cap add android

      - name: Mo quyen Micro va Internet trong AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n<\/manifest>/' $MANIFEST

      - name: Bien dich file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: HocThuoc_TiengAnh_v3_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
