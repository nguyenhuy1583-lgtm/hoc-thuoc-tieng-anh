name: Build APK Kho App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai dat Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ket noi bo doc giong noi goc cho HTML
        run: |
          node -e '
          const fs = require("fs");
          let html = fs.readFileSync("www/index.html", "utf8");
          const shim = `<script>
          window.Capacitor = window.Capacitor || {};
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          (function(){
            var cbs = {}, seq = 0;
            window.__ttsDone = function(id){ if(cbs[id]){ cbs[id](); delete cbs[id]; } };
            var tts = {
              speak: function(o){
                return new Promise(function(res){
                  if(!window.AndroidNativeTTS){ res(); return; }
                  var id = "u" + (++seq);
                  cbs[id] = res;
                  setTimeout(function(){ if(cbs[id]){ delete cbs[id]; res(); } }, 15000);
                  window.AndroidNativeTTS.speak(String(o.text||""), String(o.lang||"en-US"), Number(o.rate||1), Number(o.pitch||1), id);
                });
              },
              stop: function(){ if(window.AndroidNativeTTS) window.AndroidNativeTTS.stop(); return Promise.resolve(); }
            };
            window.Capacitor.Plugins.TextToSpeech = tts;
            if(window.AndroidNativeTTS){
              var s = {
                speaking: false, pending: false, paused: false,
                getVoices: function(){ return [{name:"Android Native",lang:"en-US",default:true,localService:true}]; },
                cancel: function(){ tts.stop(); s.speaking = false; },
                pause: function(){}, resume: function(){},
                speak: function(u){
                  if(!u || !u.text) return;
                  s.speaking = true;
                  tts.speak({text:u.text, lang:u.lang, rate:u.rate, pitch:u.pitch}).then(function(){
                    s.speaking = false;
                    if(typeof u.onend === "function") u.onend();
                  });
                }
              };
              try{ Object.defineProperty(window,"speechSynthesis",{value:s,writable:true,configurable:true}); }catch(e){}
              window.SpeechSynthesisUtterance = function(t){ this.text=t||""; this.lang="en-US"; this.rate=1; this.pitch=1; this.volume=1; };
            }
          })();
          </script>`;
          html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + shim) : shim + html;
          fs.writeFileSync("www/index.html", html, "utf8");
          '

      - name: Dong goi Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Kho Ung Dung" "com.huy.apphub" --web-dir=www
          npx cap add android

      - name: Cau hinh Android TTS va Micro
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" \/><\/intent><\/queries>\n<\/manifest>/' $MANIFEST

          cat << 'EOF' > android/app/src/main/java/com/huy/apphub/MainActivity.java
          package com.huy.apphub;

          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.util.Locale;

          public class MainActivity extends BridgeActivity {
              private TextToSpeech tts;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.US);
                      }
                  });
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String utteranceId) {}
                      @Override public void onDone(String utteranceId) { notifyEnd(utteranceId); }
                      @Override public void onError(String utteranceId) { notifyEnd(utteranceId); }
                  });
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void speak(String text, String lang, float rate, float pitch, String id) {
                              if (tts != null) {
                                  if (lang != null && !lang.isEmpty()) {
                                      tts.setLanguage(Locale.forLanguageTag(lang));
                                  }
                                  tts.setSpeechRate(rate > 0 ? rate : 1.0f);
                                  tts.setPitch(pitch > 0 ? pitch : 1.0f);
                                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id);
                              }
                          }
                          @JavascriptInterface
                          public void stop() {
                              if (tts != null) tts.stop();
                          }
                      }, "AndroidNativeTTS");
                  }
              }

              private void notifyEnd(String id) {
                  runOnUiThread(() -> {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          this.bridge.getWebView().evaluateJavascript(
                              "window.__ttsDone && window.__ttsDone('" + id + "')", null
                          );
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Bien dich APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: Kho_Ung_Dung_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
